name: refresh-upcoming

# Weekly check of public/upcoming.json against TVMaze, plus new titles from TVMaze and Wikipedia. About one billed minute per run, so roughly
# 4 to 5 minutes a month. It shares your account's monthly Actions allowance with your other repos,
# so it is built to stay tiny:
#   - one job, one weekly schedule, 5 minute hard stop, never overlaps itself
#   - nothing to install: the script uses only what Node already ships, and the runner already has Node and gh
#   - a shallow checkout, and at most 140 requests per run (one per TV show, plus about 8 to find new titles), 0.6 s apart
#   - a quiet week commits nothing and opens nothing
# It is OFF until launch. Pushing this file does nothing on its own. To turn it on at go-live:
#   repo Settings > Secrets and variables > Actions > Variables > New variable: UPCOMING_REFRESH = on
# To pause it again later, set that variable to anything else (or delete it). A skipped job costs zero minutes.
# One-time repo setting this needs for the pull request step:
#   Settings > Actions > General > Workflow permissions > "Allow GitHub Actions to create and approve pull requests"
# Safety: actions are pinned to a full commit SHA (the tag is in the comment; .github/dependabot.yml proposes updates
# once a month). The write token is not saved in .git/config, so the step that reads TVMaze and Wikipedia cannot push;
# only "Publish changes" puts it in the remote address, right before it pushes. TVMaze and Wikipedia text never reaches
# a shell line: steps read only true/false and counts from the script, and the report is a file.
on:
  schedule:
    - cron: '17 14 * * 1'   # Mondays 14:17 UTC, off the top of the hour when GitHub is busiest
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-upcoming
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ vars.UPCOMING_REFRESH == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check dates
        id: refresh
        env:
          REFRESH_CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: node scripts/refresh-upcoming.mjs --discover

      # Real changes go through a pull request so a person looks at them. If the only change is the
      # "checked" date, it is committed straight to the default branch.
      # A person's work on bot/upcoming is never overwritten: when the open pull request has a commit someone else
      # wrote (or changed), this week's update is skipped with a warning. The needs-a-look issue below still runs.
      - name: Publish changes
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUBSTANTIVE: ${{ steps.refresh.outputs.substantive }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          BOT="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "sub-rotator-bot"
          git config user.email "$BOT"
          git add public/upcoming.json
          if [ "$SUBSTANTIVE" = "true" ]; then
            # Only a pull request from this repository counts, not one from a fork that reuses the branch name.
            PR=$(gh pr list --head bot/upcoming --state open --json number,isCrossRepository --jq 'map(select(.isCrossRepository | not)) | .[0].number')
            LEASE="--force"
            if [ -n "$PR" ]; then
              # The head first, then its commits: a push in between shows up in the commits, and the lease stops one after.
              OID=$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')
              WHO=$(gh pr view "$PR" --json commits --jq '.commits[] | .authors[].email, .authoredDate == .committedDate')
              if grep -qvxF -e "$BOT" -e true <<< "$WHO"; then
                echo "::warning::Pull request #$PR has commits from a person. bot/upcoming was left alone this week. Merge or close the pull request to restart updates."
                exit 0
              fi
              LEASE="--force-with-lease=bot/upcoming:$OID"
            fi
            git checkout -B bot/upcoming
            git commit -m "chore: weekly release-date check"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push "$LEASE" origin bot/upcoming
            if [ -n "$PR" ]; then
              gh pr edit "$PR" --body-file scripts/.report.md
            else
              gh pr create --head bot/upcoming --base "$BASE" --title "Weekly release-date check" --body-file scripts/.report.md
            fi
          else
            git commit -m "chore: refresh checked date"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push
          fi

      # Movies and games cannot be checked by a script, suggested films need a yes or no (add them, or put the title in
      # "skip"), and anything the script could not reach needs a look. One issue lists whatever needs a person,
      # is updated in place each week, and closes itself when nothing is left.
      - name: Needs-a-look issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FLAGS: ${{ steps.refresh.outputs.flags }}
          IDEAS: ${{ steps.refresh.outputs.ideas }}
          UNCHECKED: ${{ steps.refresh.outputs.unchecked }}
        run: |
          N=$(gh issue list --state open --label upcoming-recheck --json number --jq '.[0].number')
          if [ "$FLAGS" != "0" ] || [ "$IDEAS" != "0" ] || [ "$UNCHECKED" != "0" ]; then
            if [ -n "$N" ]; then
              gh issue edit "$N" --body-file scripts/.report.md
            else
              gh label create upcoming-recheck --color FBCA04 --force
              gh issue create --title "Release dates need a look" --label upcoming-recheck --body-file scripts/.report.md
            fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "All clear as of $(date -u +%F)."
          fi
